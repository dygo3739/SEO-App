name: SEO Autopilot

on:
  schedule:
    # Runs daily at 8am UTC. Edit at https://crontab.guru
    - cron: "0 8 * * *"

  # Trigger a manual run from Actions tab (optionally override the topic)
  workflow_dispatch:
    inputs:
      topic_override:
        description: "Optional: run with this specific topic instead of the queue"
        required: false
        default: ""

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # allows committing state.json back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          WP_URL:             ${{ secrets.WP_URL }}
          WP_USER:            ${{ secrets.WP_USER }}
          WP_APP_PASSWORD:    ${{ secrets.WP_APP_PASSWORD }}
          DATAFORSEO_USER:    ${{ secrets.DATAFORSEO_USER }}
          DATAFORSEO_PASS:    ${{ secrets.DATAFORSEO_PASS }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PINTEREST_TOKEN:     ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          TOPIC_OVERRIDE:     ${{ github.event.inputs.topic_override }}
        run: node src/pipeline.js

      - name: Commit state.json
        if: always()  # save state even on failure so the failed run is recorded
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "chore: pipeline run $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
